name: Deploy Microservices to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

env:
  PROJECT_ID: wordwars-backend
  REGION: asia-south1
  ARTIFACT_REPO: wordwars-repo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: wordwars-gateway
            dockerfile: Dockerfile.gateway
          - name: wordwars-auth
            dockerfile: Dockerfile.auth
          - name: wordwars-game
            dockerfile: Dockerfile.game_logic
          - name: wordwars-ai-word-generator
            dockerfile: Dockerfile.ai_word_generator
          - name: wordwars-daily-challenge
            dockerfile: Dockerfile.daily_challenge
          - name: wordwars-leaderboard
            dockerfile: Dockerfile.leaderboard
          - name: wordwars-matchmaking
            dockerfile: Dockerfile.matchmaking
          - name: wordwars-multiplayer
            dockerfile: Dockerfile.multiplayer_session
            
      fail-fast: false # Don't stop other deployments if one fails

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
          
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build Docker Image
        run: |
          cd backend
          docker build -f ${{ matrix.service.dockerfile }} -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ matrix.service.name }}:${{ github.sha }} .
          docker tag ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ matrix.service.name }}:${{ github.sha }} ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ matrix.service.name }}:latest

      - name: Push Docker Image
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ matrix.service.name }}:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ matrix.service.name }}:latest

      - name: Set service-specific environment variables
        id: set-env-vars
        run: |
          case "${{ matrix.service.name }}" in
            "wordwars-gateway")
              echo "ENV_VARS=UPSTASH_REDIS_REST_URL=${{ secrets.UPSTASH_REDIS_REST_URL }},AUTH_SERVICE_URL=https://wordwars-auth-734983454951.asia-south1.run.app,GAME_SERVICE_URL=https://wordwars-game-734983454951.asia-south1.run.app,LEADERBOARD_SERVICE_URL=https://wordwars-leaderboard-734983454951.asia-south1.run.app,MATCHMAKING_SERVICE_URL=https://wordwars-matchmaking-734983454951.asia-south1.run.app,MULTIPLAYER_SESSION_URL=https://wordwars-multiplayer-734983454951.asia-south1.run.app,MONETIZATION_SERVICE_URL=https://wordwars-shop-734983454951.asia-south1.run.app,DAILY_CHALLENGE_SERVICE_URL=https://wordwars-daily-challenge-734983454951.asia-south1.run.app" >> $GITHUB_OUTPUT
              ;;
            "wordwars-auth")
              echo "ENV_VARS=MONGODB_URL=${{ secrets.MONGODB_URL }},UPSTASH_REDIS_REST_URL=${{ secrets.UPSTASH_REDIS_REST_URL }},FIREBASE_CREDENTIALS_BASE64=${{ secrets.FIREBASE_CREDENTIALS_BASE64 }}" >> $GITHUB_OUTPUT
              ;;
            "wordwars-game")
              echo "ENV_VARS=MONGODB_URL=${{ secrets.MONGODB_URL }},UPSTASH_REDIS_REST_URL=${{ secrets.UPSTASH_REDIS_REST_URL }},AI_WORD_GENERATOR_URL=https://wordwars-ai-word-generator-734983454951.asia-south1.run.app" >> $GITHUB_OUTPUT
              ;;
            "wordwars-ai-word-generator")
              echo "ENV_VARS=GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> $GITHUB_OUTPUT
              ;;
            "wordwars-daily-challenge")
              echo "ENV_VARS=UPSTASH_REDIS_REST_URL=${{ secrets.UPSTASH_REDIS_REST_URL }},AI_WORD_GENERATOR_URL=https://wordwars-ai-word-generator-734983454951.asia-south1.run.app" >> $GITHUB_OUTPUT
              ;;
            "wordwars-leaderboard")
              echo "ENV_VARS=MONGODB_URL=${{ secrets.MONGODB_URL }}" >> $GITHUB_OUTPUT
              ;;
            "wordwars-matchmaking")
              echo "ENV_VARS=UPSTASH_REDIS_REST_URL=${{ secrets.UPSTASH_REDIS_REST_URL }},MULTIPLAYER_SESSION_WS_URL=wss://wordwars-multiplayer-734983454951.asia-south1.run.app" >> $GITHUB_OUTPUT
              ;;
            "wordwars-multiplayer")
              echo "ENV_VARS=UPSTASH_REDIS_REST_URL=${{ secrets.UPSTASH_REDIS_REST_URL }},MONGODB_URL=${{ secrets.MONGODB_URL }},AUTH_SERVICE_URL=https://wordwars-auth-734983454951.asia-south1.run.app,AI_WORD_GENERATOR_URL=https://wordwars-ai-word-generator-734983454951.asia-south1.run.app,LEADERBOARD_SERVICE_URL=https://wordwars-leaderboard-734983454951.asia-south1.run.app,GAME_SERVICE_URL=https://wordwars-game-734983454951.asia-south1.run.app" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "ENV_VARS=" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ matrix.service.name }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ matrix.service.name }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --set-env-vars ${{ steps.set-env-vars.outputs.ENV_VARS }} \
            --allow-unauthenticated \
            --quiet
